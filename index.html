<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface2:#F0F2F4; --tonal:#F0F2F4; --tonal2:#E4E7EA;
  --ink:#15171A; --muted:#6B7076;
  --border:rgba(20,26,34,.08); --border-strong:rgba(20,26,34,.16);
  --green:#0FA958; --blue:#2E7CF6; --orange:#F26B1D; --steel:#5B6472;
  --gold:#C77E06; --amber-tint:#FDF3E2;
  --accent:var(--green);
  --tint:color-mix(in srgb,var(--accent) 10%,#fff);
  --over:#E5484D; --ok:#0FA958;
  --ring-track:#EAECEF;
  --shadow:0 1px 2px rgba(20,26,34,.05),0 3px 10px rgba(20,26,34,.05);
  --spring:cubic-bezier(.3,1.35,.6,1);
  --display:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100dvh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));}
body[data-view="today"]{--accent:var(--green);}
body[data-view="trends"]{--accent:var(--blue);}
body[data-view="foods"]{--accent:var(--orange);}
body[data-view="settings"]{--accent:var(--steel);}
#wrap{max-width:480px;margin:0 auto;padding:0 16px;}
header{display:flex;align-items:center;justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top)) 2px 12px;}
header h1{font-size:30px;font-weight:800;letter-spacing:-.025em;color:var(--accent);}
#syncdot{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;
  background:var(--surface);border:0.5px solid var(--border);padding:5px 11px;border-radius:999px;box-shadow:var(--shadow);}
#syncdot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot,#9CA1A7);}
#syncdot.ok{--dot:var(--ok);} #syncdot.pending{--dot:var(--gold);} #syncdot.err{--dot:var(--over);}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#main{animation:fadeUp .24s ease-out;}
@media (prefers-reduced-motion: reduce){#main{animation:none;}}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:18px;
  padding:15px 17px;margin-bottom:12px;box-shadow:var(--shadow);}
.card h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:9px;}
.row{display:flex;align-items:center;gap:10px;}
.spread{justify-content:space-between;}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;}
.big{font-size:32px;font-weight:800;}
.mid{font-size:20px;font-weight:700;}
.sub{font-size:13px;color:var(--muted);line-height:1.5;}
.heronum2{font-family:var(--display);font-size:42px;font-weight:800;letter-spacing:-.03em;
  line-height:1.05;font-variant-numeric:tabular-nums;}
.heronum2.neg{color:var(--over);}
.hero2 .sub{font-size:12.5px;}
.meter{height:10px;border-radius:5px;background:var(--ring-track);overflow:hidden;}
.meter>div{height:100%;border-radius:5px;background:var(--accent);transition:width .45s var(--spring);}
.meter.thin{height:6px;border-radius:3px;margin:8px 0 4px;}
.meter.thin>div{border-radius:3px;}
.meterlabels{margin:8px 0 4px;}
.streak{background:color-mix(in srgb,var(--green) 12%,#fff);color:var(--green);font-weight:700;
  font-size:12.5px;padding:5px 11px;border-radius:999px;white-space:nowrap;}
button{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);background:var(--surface2);
  border:none;border-radius:999px;padding:11px 17px;cursor:pointer;
  transition:transform .15s var(--spring);}
button:active{transform:scale(.96);}
button.primary{background:var(--accent);color:#fff;font-weight:700;padding:14px 18px;font-size:16px;}
button.ghost{background:transparent;color:var(--accent);font-weight:700;padding:9px 11px;}
button.danger{color:var(--over);}
button:disabled{opacity:.45;}
input,select,textarea{font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--surface2);border:1px solid transparent;border-radius:13px;padding:11px 13px;width:100%;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);background:#fff;}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin:11px 0 4px;}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 11px;scrollbar-width:none;}
#chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;font-size:13.5px;font-weight:600;padding:10px 15px;border-radius:999px;
  background:var(--surface);border:0.5px solid var(--border);box-shadow:var(--shadow);color:var(--ink);white-space:nowrap;}

.entry{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px;
  border-bottom:1px solid rgba(20,26,34,.05);gap:8px;}
.entry:last-child{border-bottom:none;}
.entry .n{font-size:15px;font-weight:500;} .entry .t{font-size:11px;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums;}
.entry .k{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:700;}

#parserow textarea{resize:none;height:80px;border-radius:16px;background:var(--surface);border:0.5px solid var(--border);box-shadow:var(--shadow);}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:440px;background:rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:0.5px solid var(--border);border-radius:999px;display:flex;justify-content:space-around;
  padding:6px;z-index:40;box-shadow:0 8px 28px rgba(20,26,34,.14);}
nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:600;color:var(--muted);padding:7px 0;flex:1;border-radius:999px;}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
nav button.on{color:var(--accent);background:var(--tint);font-weight:700;}
#overlay{position:fixed;inset:0;background:rgba(15,18,22,.4);z-index:60;display:none;
  align-items:flex-end;justify-content:center;}
#overlay.show{display:flex;}
#sheet{background:var(--bg);width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;
  border-radius:26px 26px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));}
#sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;
  background:var(--tonal2);margin:0 auto 14px;}
#sheet h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
.sheet-item{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;
  padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
.sheet-item .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
.sheet-item input{padding:8px 10px;font-size:15px;}
.srcbadge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.srcbadge.lib{background:color-mix(in srgb,var(--green) 12%,#fff);color:var(--green);}
.srcbadge.ai{background:color-mix(in srgb,var(--blue) 12%,#fff);color:var(--blue);}
#toast{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:999px;
  z-index:70;display:none;align-items:center;gap:12px;white-space:nowrap;box-shadow:0 8px 26px rgba(0,0,0,.28);}
#toast button{background:none;border:none;color:inherit;font-weight:800;padding:0;text-decoration:underline;}
.chart{width:100%;height:auto;display:block;}
.chart text{font-family:var(--sans);fill:var(--muted);font-size:9px;}
.banner{background:var(--amber-tint);border:none;
  border-radius:16px;padding:13px 15px;font-size:13.5px;margin-bottom:12px;line-height:1.5;}
.foodrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(20,26,34,.05);}
.foodrow:last-child{border-bottom:none;}
.foodrow .star{font-size:18px;color:var(--tonal2);background:none;border:none;padding:4px;}
.foodrow .star.fav{color:#F0A312;}
.wkrow{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid rgba(20,26,34,.05);font-size:14px;}
.wkrow:last-child{border-bottom:none;}
h4.sec{font-size:16px;font-weight:800;margin:18px 0 8px;}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.kpi{background:var(--surface);border-radius:16px;border:0.5px solid var(--border);padding:13px 15px;box-shadow:var(--shadow);}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.kpi .l{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em;}
</style>

<body data-view="today">
<div id="wrap">
  <header><h1 id="title">Balance</h1><span id="syncdot">local</span></header>
  <main id="main"></main>
</div>

<nav>
  <button id="tab-today" onclick="go('today')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Today</button>
  <button id="tab-trends" onclick="go('trends')"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Trends</button>
  <button id="tab-foods" onclick="go('foods')"><svg viewBox="0 0 24 24"><path d="M5 3v18M5 10c3 0 4-2 4-7M12 3v18M12 3c4 1 4 8 0 9"/><path d="M18 3c2 2 3 5 3 8s-1 4-3 4v6"/></svg>Foods</button>
  <button id="tab-settings" onclick="go('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</button>

<div id="toast"></div>

<script>
"use strict";
const APP_VERSION = "2.3.0";
/* ───────────────────────── state ───────────────────────── */
const DEMO = location.search.includes("demo=1");
const LSKEY = DEMO ? "balance:demo" : "balance:v1";
const SECKEY = "balance:secrets";

let S = load() || seed();
let SEC = JSON.parse(localStorage.getItem(SECKEY) || "{}");
if(!SEC.repo) SEC.repo = "DanielPlochinger/balance-data";
if(!SEC.model) SEC.model = "claude-opus-5";
let remoteSha = null, syncTimer = null, view = "today", pendingItems = null;

function load(){ try{ return JSON.parse(localStorage.getItem(LSKEY)); }catch(e){ return null; } }
function seed(){
  const s = { v:1,
    config:{ budget:2000, protein:130, cap:300, floor:1500, goal:null, u:Date.now() },
    days:{}, foods:[] };
  if(DEMO) demoSeed(s);
  return s;
}
function persist(){ localStorage.setItem(LSKEY, JSON.stringify(S)); scheduleSync(); }
function saveSec(){ localStorage.setItem(SECKEY, JSON.stringify(SEC)); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function dkey(d){ const x = d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function dayRec(k){ if(!S.days[k]) S.days[k] = { e:[], u:0 }; return S.days[k]; }
function touch(k){ S.days[k].u = Date.now(); persist(); }
function purgeWiped(){
  const w = S.config.wipedAt || 0; if(!w) return;
  for(const k of Object.keys(S.days)) if((S.days[k].u||0) < w) delete S.days[k];
}

/* ───────────────────────── math ───────────────────────── */
const cfg = () => S.config;
const consumed = r => (r.e||[]).reduce((a,x)=>a+x.k,0);
const protein  = r => (r.e||[]).reduce((a,x)=>a+(x.p||0),0);
const eff = r => r.cheat ? r.cheat.total : cfg().budget + (r.adj||0);
const tracked = r => r && r.e && r.e.length > 0;

function bank(){
  const today = dkey(); let b = 0;
  for(const k of Object.keys(S.days)){
    const r = S.days[k];
    if(r.cheat) b -= r.cheat.bank || 0;
    if(k >= today || !tracked(r)) continue;
    const net = eff(r) - consumed(r);
    b += net >= 0 ? Math.min(net, cfg().cap) : net;
  }
  return Math.round(b);
}
function streak(){
  let n = 0; const d = new Date(); d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){
    const r = S.days[dkey(d)];
    if(tracked(r) && consumed(r) <= eff(r)) { n++; d.setDate(d.getDate()-1); }
    else break;
  }
  const t = S.days[dkey()];
  if(tracked(t) && consumed(t) <= eff(t)) n++;
  return n;
}
function weekStart(k){ const d = new Date(k+"T12:00"); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return dkey(d); }
function weeklyCloses(){
  const wk = {};
  const today = dkey();
  for(const k of Object.keys(S.days)){
    const r = S.days[k];
    if(!tracked(r) || k >= today) continue;
    const w = weekStart(k);
    wk[w] = wk[w] || { net:0, days:0 };
    wk[w].net += eff(r) - consumed(r);
    wk[w].days++;
  }
  return Object.entries(wk).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
}
function ema(pairs, a=0.3){
  let m = null; const out = [];
  for(const [k,w] of pairs){ m = m===null ? w : a*w + (1-a)*m; out.push([k,m]); }
  return out;
}
function weights(n){
  const out = []; const d = new Date(); d.setDate(d.getDate()-n+1);
  for(let i=0;i<n;i++){ const k = dkey(d); const r = S.days[k];
    if(r && r.w) out.push([k, r.w]); d.setDate(d.getDate()+1); }
  return out;
}

/* ───────────────────────── cheat planner ───────────────────────── */
function planCheat(dateK, total){
  const B = cfg().budget, extra = Math.max(0, total - B);
  const avail = Math.max(bank(), 0);
  const useBank = Math.min(avail, extra);
  let rem = extra - useBank;
  const maxCut = B - cfg().floor;
  if(maxCut <= 0) return { err:"Your floor is at or above your budget — fix in Settings." };
  const nDays = rem > 0 ? Math.ceil(rem / maxCut) : 0;
  if(nDays > 14) return { err:`That's ${rem} kcal beyond bank + 14 days of headroom. Lower the total or bank more first.` };
  const per = nDays ? Math.ceil(rem / nDays) : 0;
  return { total, useBank, rem, nDays, per };
}
function lockCheat(dateK, plan){
  const r = dayRec(dateK);
  r.cheat = { total: plan.total, bank: plan.useBank };
  let rem = plan.rem;
  const d = new Date(dateK+"T12:00");
  for(let i=0;i<plan.nDays;i++){
    d.setDate(d.getDate()+1);
    const k = dkey(d); const rr = dayRec(k);
    const cut = Math.min(plan.per, rem);
    rr.adj = (rr.adj||0) - cut; rr.u = Date.now();
    rem -= cut;
  }
  r.u = Date.now(); persist();
}

/* ───────────────────────── LLM parse ───────────────────────── */
async function llmParse(text){
  if(DEMO) return demoParse(text);
  if(!SEC.anthropic) throw new Error("No Claude API key yet — add it in Settings.");
  const lib = S.foods.slice(0,300).map(f=>`${f.i}|${f.n}${f.a&&f.a.length?" ("+f.a.join(", ")+")":""}|per ${f.per==="item"?"item":f.per==="100ml"?"100 ml":"100 g"}|${f.k} kcal|${f.p} g protein`).join("\n");
  const sys = `You convert casual food-diary text (often dictated, possibly German or English) into structured nutrition data.
Rules:
- Split the text into individual food items with quantities.
- The user's saved foods are listed below with an id. If an item clearly matches one, set library_id to that id — the app recomputes kcal/protein from the library, so your numbers are only a fallback.
- Otherwise estimate kcal and protein yourself using standard nutrition knowledge. kcal and protein_g must be TOTALS for the stated quantity.
- grams: your best estimate of the total weight in grams for the line (0 if it makes no sense). For drinks and liquids — especially library foods with a per-100 ml basis — report the volume in millilitres as grams (assume 1 ml ≈ 1 g).
- unit: short label like "item", "g", "ml", "slice", "cup".
- Keep names short and singular ("Cappuccino", not "two cappuccinos").
User's saved foods (id|name|basis|kcal|protein):
${lib || "(none yet)"}`;
  const schema = { type:"object", additionalProperties:false, required:["items"], properties:{
    items:{ type:"array", items:{ type:"object", additionalProperties:false,
      required:["name","qty","unit","grams","kcal","protein_g","library_id"],
      properties:{ name:{type:"string"}, qty:{type:"number"}, unit:{type:"string"},
        grams:{type:"number"}, kcal:{type:"number"}, protein_g:{type:"number"},
        library_id:{type:"string"} } } } } };
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":SEC.anthropic,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model:SEC.model, max_tokens:2500,
      output_config:{ effort:"low", format:{ type:"json_schema", schema } },
      system:sys, messages:[{ role:"user", content:text }] })
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error("Claude API " + res.status + ": " + (err.error && err.error.message || "request failed"));
  }
  const msg = await res.json();
  if(msg.stop_reason === "refusal") throw new Error("Claude declined this request — try rephrasing.");
  const block = (msg.content||[]).find(b=>b.type==="text");
  if(!block) throw new Error("Empty response from Claude.");
  return JSON.parse(block.text).items || [];
}

function findFood(id){ return S.foods.find(f=>f.i===id); }
function enrich(items){
  return items.map(it=>{
    const f = it.library_id ? findFood(it.library_id) : null;
    let k = Math.round(it.kcal), p = Math.round(it.protein_g*10)/10, src = "ai";
    if(f){
      src = "lib";
      if(f.per === "item"){ k = Math.round(f.k * it.qty); p = Math.round(f.p * it.qty * 10)/10; }
      else { const g = it.grams > 0 ? it.grams : (f.g||100) * it.qty;
             k = Math.round(f.k * g/100); p = Math.round(f.p * g/100 * 10)/10; }
    }
    return { name:it.name, qty:it.qty, unit:it.unit, grams:it.grams, k, p, src,
             save: src==="ai" && !S.foods.some(x=>x.n.toLowerCase()===it.name.toLowerCase()) };
  });
}

/* ───────────────────────── sync (GitHub) ───────────────────────── */
function ghReady(){ return !DEMO && SEC.github && SEC.repo; }
function ghUrl(){ return `https://api.github.com/repos/${SEC.repo}/contents/state.json`; }
function ghHeaders(){ return { "Authorization":"Bearer "+SEC.github, "Accept":"application/vnd.github+json" }; }
function setDot(cls, txt){ const d = document.getElementById("syncdot"); d.className = cls; d.textContent = txt; }

const hasContent = d => !!(d && ((d.e && d.e.length) || d.w || d.cheat || d.adj));
function mergeState(remote){
  if(!remote) return;
  if((remote.config?.u||0) > (S.config.u||0)) S.config = remote.config;
  for(const [k,r] of Object.entries(remote.days||{})){
    const mine = S.days[k];
    // Content always beats an empty record; timestamps only break content-vs-content ties.
    const better = !mine ? true
      : hasContent(r) && !hasContent(mine) ? true
      : !hasContent(r) && hasContent(mine) ? false
      : (r.u||0) > (mine.u||0);
    if(better) S.days[k] = r;
  }
  const mine = Object.fromEntries(S.foods.map(f=>[f.i,f]));
  for(const f of (remote.foods||[]))
    if(!mine[f.i] || (f.u||0) > (mine[f.i].u||0)) mine[f.i] = f;
  S.foods = Object.values(mine);
  purgeWiped();
}
let lastSyncErr = null;
async function pull(){
  if(!ghReady()) return;
  try{
    setDot("pending","syncing");
    const res = await fetch(ghUrl()+"?ref=main", { headers: ghHeaders() });
    if(res.status === 404){ remoteSha = null; setDot("ok","synced"); return; }
    if(!res.ok) throw new Error(await ghErr(res));
    const j = await res.json();
    remoteSha = j.sha;
    mergeState(JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))))));
    localStorage.setItem(LSKEY, JSON.stringify(S));
    lastSyncErr = null; setDot("ok","synced"); render();
  }catch(e){ lastSyncErr = e.message; setDot("err","sync error"); }
}
async function push(retry){
  if(!ghReady()) { setDot("","local"); return; }
  try{
    setDot("pending","syncing");
    const body = { message:"balance "+new Date().toISOString().slice(0,16),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(S)))) };
    if(remoteSha) body.sha = remoteSha;
    const res = await fetch(ghUrl(), { method:"PUT", headers:ghHeaders(), body:JSON.stringify(body) });
    if(res.status === 409 || res.status === 422){
      if(!retry){ await pull(); return push(true); }
      throw new Error("conflict after retry");
    }
    if(!res.ok) throw new Error(await ghErr(res));
    remoteSha = (await res.json()).content.sha;
    lastSyncErr = null; setDot("ok","synced");
  }catch(e){ lastSyncErr = e.message; setDot("err","sync error"); }
}
async function ghErr(res){
  const j = await res.json().catch(()=>({}));
  return "HTTP "+res.status+(j.message?" — "+j.message:"");
}
async function testConnections(){
  const out = $("#testout"); out.innerHTML = `<div class="sub">Testing…</div>`;
  let gh = "", cl = "";
  // GitHub: can the token see the repo, and can it write?
  if(!SEC.github) gh = "✗ No GitHub token entered.";
  else try{
    const res = await fetch("https://api.github.com/repos/"+SEC.repo, { headers: ghHeaders() });
    if(res.status === 401) gh = "✗ GitHub says the token itself is invalid or expired (401). Regenerate it and paste again.";
    else if(res.status === 404) gh = `✗ Token works but cannot see <b>${esc(SEC.repo)}</b> (404). Two usual causes: the token's <i>Repository access</i> doesn't include balance-data, or the repo field is wrong — it must be exactly <code>DanielPlochinger/balance-data</code>.`;
    else if(!res.ok) gh = "✗ GitHub: "+await ghErr(res);
    else {
      const j = await res.json();
      gh = j.permissions && j.permissions.push
        ? "✓ GitHub: token sees the repo and has write access."
        : "✗ Token sees the repo but is <b>read-only</b> — edit the token and set Contents to <i>Read and write</i>.";
    }
  }catch(e){ gh = "✗ GitHub unreachable: "+esc(e.message); }
  // Claude: minimal ping
  if(!SEC.anthropic) cl = "✗ No Claude API key entered.";
  else try{
    const res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST",
      headers:{ "content-type":"application/json", "x-api-key":SEC.anthropic,
        "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:SEC.model, max_tokens:1, messages:[{role:"user",content:"ping"}] }) });
    if(res.status === 401) cl = "✗ Claude: key rejected (401) — re-copy it from console.anthropic.com.";
    else if(res.ok) cl = "✓ Claude: key works, model responds.";
    else { const j = await res.json().catch(()=>({}));
      cl = "✗ Claude: HTTP "+res.status+" — "+esc(j.error && j.error.message || "unknown error")
         + (res.status===400 && /credit|billing/i.test(j.error&&j.error.message||"") ? " (add credit under Billing)" : ""); }
  }catch(e){ cl = "✗ Claude unreachable: "+esc(e.message); }
  out.innerHTML = `<div class="sub" style="margin-top:8px">${gh}<br>${cl}${lastSyncErr?`<br>Last sync error: ${esc(lastSyncErr)}`:""}</div>`;
  if(gh.startsWith("✓")) { await pull(); push(false); }
}

function chartWeight(n){
  const pts = weights(n); if(pts.length < 2) return `<div class="sub">Log your weight a few mornings and the trend appears here.</div>`;
  const sm = ema(pts);
  const W = 340, H = 150, P = 24;
  const ys = pts.map(p=>p[1]).concat(cfg().goal?[cfg().goal]:[]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = Math.max((hi-lo)*0.15, 0.4); lo-=pad; hi+=pad;
  const X = i => P + i*(W-P-8)/(pts.length-1);
  const Y = v => H-16 - (v-lo)*(H-28)/(hi-lo);
  const line = sm.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const goal = cfg().goal ? `<line x1="${P}" x2="${W-8}" y1="${Y(cfg().goal)}" y2="${Y(cfg().goal)}" stroke="var(--gold)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-10}" y="${Y(cfg().goal)-4}" text-anchor="end" fill="var(--gold)">goal ${cfg().goal}</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <line x1="${P}" x2="${W-8}" y1="${H-16}" y2="${H-16}" stroke="var(--border)" />
    ${goal}
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[1])}" r="2.8" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.2" opacity="0.8"><title>${p[0]}: ${p[1]} kg</title></circle>`).join("")}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(sm[sm.length-1][1])}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${P}" y="10">${hi.toFixed(1)}</text><text x="${P}" y="${H-4}">${lo.toFixed(1)}</text>
    <text x="${W-8}" y="10" text-anchor="end" fill="var(--ink)" font-weight="600">${sm[sm.length-1][1].toFixed(1)} kg trend</text>
  </svg>`;
}
function chartCals(n){
  const days = []; const d = new Date(); d.setDate(d.getDate()-n+1);
  for(let i=0;i<n;i++){ const k = dkey(d); days.push([k, S.days[k]]); d.setDate(d.getDate()+1); }
  const W = 340, H = 130, P = 6, bw = (W-2*P)/n - 3;
  const B = cfg().budget;
  const maxV = Math.max(B*1.3, ...days.map(([k,r])=>r?consumed(r):0));
  const Y = v => H-18 - v*(H-34)/maxV;
  let bars = "";
  days.forEach(([k,r],i)=>{
    if(!tracked(r)) return;
    const c = consumed(r), e = eff(r), x = P + i*((W-2*P)/n);
    const col = r.cheat ? "var(--gold)" : c > e ? "var(--over)" : "var(--accent)";
    bars += `<rect x="${x.toFixed(1)}" y="${Y(c).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-18-Y(c)).toFixed(1)}" rx="2.5" fill="${col}"><title>${k}: ${Math.round(c)} / ${Math.round(e)} kcal</title></rect>`;
    if(r.cheat) bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(Y(c)-4).toFixed(1)}" text-anchor="middle">🎉</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <line x1="${P}" x2="${W-P}" y1="${Y(B)}" y2="${Y(B)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>
    <text x="${W-P}" y="${Y(B)-4}" text-anchor="end">budget ${B}</text>
    ${bars}<line x1="${P}" x2="${W-P}" y1="${H-18}" y2="${H-18}" stroke="var(--border)"/>
    <text x="${P}" y="${H-4}">${days[0][0].slice(5)}</text><text x="${W-P}" y="${H-4}" text-anchor="end">today</text>
  </svg>`;
}

                       .sort((a,b)=>(b.fav?1:0)-(a.fav?1:0) || a.n.localeCompare(b.n));
  let h = `<div class="row" style="margin-bottom:10px">
    <input placeholder="Search foods…" value="${esc(window._fq||"")}" oninput="window._fq=this.value;render()">
    <button class="primary" style="padding:11px 15px;font-size:14.5px;flex:0 0 auto" onclick="foodSheet()">+ Add</button></div>`;
  h += `<div class="card">`;
  h += foods.length ? foods.map(f=>`<div class="foodrow">
      <button class="star ${f.fav?"fav":""}" onclick="toggleFav('${f.i}')">★</button>
      <span style="flex:1" onclick="foodSheet('${f.i}')"><div style="font-size:15px">${esc(f.n)}</div>
        <div class="sub">${f.k} kcal · ${f.p} g protein ${f.per==="item"?"per item":f.per==="100ml"?"per 100 ml":"per 100 g"}${f.a&&f.a.length?" · "+esc(f.a.join(", ")):""}</div></span>
      <span class="sub">›</span></div>`).join("")
    : `<div class="sub">Your personal foods live here — Claude's estimates never override them. Log something new and tick "Save to my foods", or add one manually. Starred foods become quick-log chips on Today.</div>`;
  h += `</div>`;
  return h;
}
function toggleFav(id){ const f = findFood(id); f.fav = !f.fav; f.u = Date.now(); persist(); render(); }
function foodSheet(id){
  const f = id ? findFood(id) : { n:"", a:[], per:"item", k:"", p:"", fav:false };
  sheet(`<h2>${id?"Edit":"New"} food</h2>
    <label>Name</label><input id="fn" value="${esc(f.n)}">
    <label>Aliases (comma-separated — dictation nicknames)</label><input id="fa" value="${esc((f.a||[]).join(", "))}">
    <label>Basis</label><select id="fper"><option value="item" ${f.per==="item"?"selected":""}>Per item / serving</option>
      <option value="100g" ${f.per==="100g"?"selected":""}>Per 100 g</option>
      <option value="100ml" ${f.per==="100ml"?"selected":""}>Per 100 ml</option></select>
    <div class="row"><span style="flex:1"><label>kcal</label><input id="fk" type="number" inputmode="numeric" value="${f.k}"></span>
      <span style="flex:1"><label>Protein g</label><input id="fp" type="number" inputmode="decimal" value="${f.p}"></span></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" style="flex:1" onclick="foodSave('${id||""}')">Save</button>
      ${id?`<button class="danger" onclick="foodDel('${id}')">Delete</button>`:""}
      <button onclick="closeSheet()">Cancel</button></div>`);
}
function foodSave(id){
  const n = $("#fn").value.trim(); if(!n) return;
  const data = { n, a:$("#fa").value.split(",").map(s=>s.trim()).filter(Boolean),
    per:$("#fper").value, k:parseFloat($("#fk").value)||0, p:parseFloat($("#fp").value)||0, u:Date.now() };
  if(id){ Object.assign(findFood(id), data); } else { S.foods.push({ i:uid(), fav:false, ...data }); }
  persist(); closeSheet(); render();
}
function foodDel(id){ S.foods = S.foods.filter(f=>f.i!==id); persist(); closeSheet(); render(); }

/* ───────────────────────── Settings ───────────────────────── */
function renderSettings(){
  const c = cfg();
  return `
  <div class="card"><h3>Targets</h3>
    <label>Daily calorie budget</label><input id="s-budget" type="number" inputmode="numeric" value="${c.budget}">
    <label>Daily protein target (g)</label><input id="s-protein" type="number" inputmode="numeric" value="${c.protein}">
    <label>Goal weight (kg, optional)</label><input id="s-goal" type="number" inputmode="decimal" value="${c.goal||""}">
  </div>
  <div class="card"><h3>Bank rules</h3>
    <label>Max deposit per day (kcal under budget that counts)</label><input id="s-cap" type="number" inputmode="numeric" value="${c.cap}">
    <label>Daily floor — financing never cuts below this</label><input id="s-floor" type="number" inputmode="numeric" value="${c.floor}">
  </div>
  <div class="card"><h3>Connections</h3>
    <label>Claude API key <span style="color:${SEC.anthropic?"var(--ok)":"var(--over)"}">${SEC.anthropic?"● connected":"● missing"}</span></label>
    <input id="s-anthropic" type="password" placeholder="sk-ant-…" value="${esc(SEC.anthropic||"")}">
    <label>Model</label><select id="s-model">
      ${["claude-opus-5","claude-sonnet-5","claude-haiku-4-5"].map(m=>`<option ${SEC.model===m?"selected":""}>${m}</option>`).join("")}</select>
    <label>GitHub token (fine-grained, balance-data repo) <span style="color:${SEC.github?"var(--ok)":"var(--over)"}">${SEC.github?"● connected":"● missing"}</span></label>
    <input id="s-github" type="password" placeholder="github_pat_…" value="${esc(SEC.github||"")}">
    <label>Data repo</label><input id="s-repo" value="${esc(SEC.repo)}">
    <div class="row" style="margin-top:12px"><button class="primary" style="flex:1" onclick="saveSettings()">Save settings</button>
    <button onclick="testConnections()">Test connections</button></div>
    <div id="testout"></div>
    <div class="sub" style="margin-top:8px">Keys are stored only on this device, never in the synced data.</div>
  </div>
  <div class="card"><h3>Data</h3>
    <div class="row"><button style="flex:1" onclick="exportData()">Export backup</button>
    <button style="flex:1" onclick="importSheet()">Import</button></div>
    <div class="sub" style="margin-top:8px">Balance v${APP_VERSION} · ${Object.keys(S.days).length} days · ${S.foods.length} foods · synced to ${esc(SEC.repo)}</div>
  </div>`;
}
function saveSettings(){
  const c = cfg();
  c.budget = parseInt($("#s-budget").value)||2000;
  c.protein = parseInt($("#s-protein").value)||130;
  c.goal = parseFloat($("#s-goal").value)||null;
  c.cap = parseInt($("#s-cap").value)||300;
  c.floor = parseInt($("#s-floor").value)||1500;
  c.u = Date.now();
  SEC.anthropic = $("#s-anthropic").value.replace(/\s/g,"");
  SEC.model = $("#s-model").value;
  SEC.github = $("#s-github").value.replace(/[^A-Za-z0-9_]/g,"");
  SEC.repo = $("#s-repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");
  saveSec(); persist(); toast("Saved"); pull(); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "balance-backup-"+dkey()+".json"; a.click();
}
function importSheet(){
  sheet(`<h2>Import backup</h2><label>Paste backup JSON</label><textarea id="imp" style="height:120px"></textarea>
    <div class="row" style="margin-top:12px"><button class="primary danger" style="flex:1" onclick="doImport()">Replace my data</button>
    <button onclick="closeSheet()">Cancel</button></div>`);
}
function doImport(){
  try{ const j = JSON.parse($("#imp").value); if(!j.days || !j.config) throw 0;
    S = j; persist(); closeSheet(); toast("Imported"); render();
  }catch(e){ toast("That didn't look like a Balance backup."); }
}
