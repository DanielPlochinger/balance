<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Balance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Balance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" href="icon-180.png?v=4">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface2:#F0F2F4; --tonal2:#E4E7EA;
  --ink:#15171A; --muted:#6B7076;
  --border:rgba(20,26,34,.08); --border-strong:rgba(20,26,34,.16);
  --green:#0FA958; --blue:#2E7CF6; --orange:#F26B1D; --steel:#5B6472;
  --indigo:#4E5BA6; --brick:#B23B2E;
  --gold:#C77E06; --amber-tint:#FDF3E2;
  --accent:var(--green);
  --tint:color-mix(in srgb,var(--accent) 10%,#fff);
  --over:#E5484D; --ok:#0FA958;
  --ring-track:#EAECEF;
  --shadow:0 1px 2px rgba(20,26,34,.05),0 3px 10px rgba(20,26,34,.05);
  --spring:cubic-bezier(.3,1.35,.6,1);
  --display:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100dvh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));}
body[data-view="today"]{--accent:var(--green);}
body[data-view="trends"]{--accent:var(--blue);}
body[data-view="foods"]{--accent:var(--orange);}
body[data-view="activity"]{--accent:var(--indigo);}
body[data-view="settings"]{--accent:var(--steel);}
#wrap{max-width:480px;margin:0 auto;padding:0 16px;}
header{display:flex;align-items:center;justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top)) 2px 12px;}
header h1{font-size:30px;font-weight:800;letter-spacing:-.025em;color:var(--accent);}
#syncdot{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;
  background:var(--surface);border:0.5px solid var(--border);padding:5px 11px;border-radius:999px;box-shadow:var(--shadow);}
#syncdot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot,#9CA1A7);}
#syncdot.ok{--dot:var(--ok);} #syncdot.pending{--dot:var(--gold);} #syncdot.err{--dot:var(--over);}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#main{animation:fadeUp .24s ease-out;}
@media (prefers-reduced-motion: reduce){#main{animation:none;}}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:18px;
  padding:15px 17px;margin-bottom:12px;box-shadow:var(--shadow);}
.card h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:9px;}
.row{display:flex;align-items:center;gap:10px;}
.spread{justify-content:space-between;}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;}
.big{font-size:32px;font-weight:800;}
.mid{font-size:20px;font-weight:700;}
.sub{font-size:13px;color:var(--muted);line-height:1.5;}
.heronum2{font-family:var(--display);font-size:42px;font-weight:800;letter-spacing:-.03em;
  line-height:1.05;font-variant-numeric:tabular-nums;}
.heronum2.neg{color:var(--over);}
.hero2 .sub{font-size:12.5px;}
.streak{background:color-mix(in srgb,var(--green) 12%,#fff);color:var(--green);font-weight:700;
  font-size:12.5px;padding:5px 11px;border-radius:999px;white-space:nowrap;}
button{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--ink);background:var(--surface2);
  border:none;border-radius:999px;padding:11px 17px;cursor:pointer;
  transition:transform .15s var(--spring);}
button:active{transform:scale(.96);}
button.primary{background:var(--accent);color:#fff;font-weight:700;}
button.ghost{background:transparent;color:var(--accent);font-weight:700;padding:9px 11px;}
button.danger{color:var(--over);}
button:disabled{opacity:.45;}
button.offv{opacity:.45;}
/* size tiers (v3.0 audit): color classes never size — every capsule wears
   one tier (md = base default; sheet footers keep their own uniform tier) */
button.lg{padding:14px 18px;font-size:16px;}
button.md{padding:11px 17px;font-size:15px;}
button.sm{padding:11px 15px;font-size:14.5px;}
input,select,textarea{font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--surface2);border:1px solid transparent;border-radius:13px;padding:11px 13px;width:100%;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);background:#fff;}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin:11px 0 4px;}
#chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 11px;scrollbar-width:none;}
#chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;font-size:13.5px;font-weight:600;padding:10px 15px;border-radius:999px;
  background:var(--surface);border:0.5px solid var(--border);box-shadow:var(--shadow);color:var(--ink);white-space:nowrap;}
.chip .sub{color:var(--accent);font-weight:700;font-size:13px;}
.entry{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px;
  border-bottom:1px solid rgba(20,26,34,.05);gap:8px;}
.entry:last-child{border-bottom:none;}
.entry .n{font-size:15px;font-weight:500;} .entry .t{font-size:11px;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums;}
.entry .k{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:700;}
#parserow{display:flex;gap:8px;margin-bottom:10px;}
#parserow textarea{resize:none;height:80px;border-radius:16px;background:var(--surface);border:0.5px solid var(--border);box-shadow:var(--shadow);}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:440px;background:rgba(255,255,255,.85);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:0.5px solid var(--border);border-radius:999px;display:flex;justify-content:space-around;
  padding:6px;z-index:40;box-shadow:0 8px 28px rgba(20,26,34,.14);}
nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:600;color:var(--muted);padding:7px 0;flex:1;border-radius:999px;}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
nav button.on{color:var(--accent);background:var(--tint);font-weight:700;}
#overlay{position:fixed;inset:0;background:rgba(15,18,22,.4);z-index:60;display:none;
  align-items:flex-end;justify-content:center;}
#overlay.show{display:flex;}
#sheet.tall{min-height:60dvh;}
#sheet{background:var(--bg);width:100%;max-width:480px;max-height:88dvh;
  border-radius:26px 26px 0 0;display:flex;flex-direction:column;overflow:hidden;}
#sheetbody{overflow-y:auto;padding:22px 16px 14px;flex:1;}
#sheetfoot{display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  background:var(--bg);transition:box-shadow .2s ease;}
#sheetfoot.edge{box-shadow:0 -8px 20px rgba(20,26,34,.09);}
#sheetfoot button{flex:1;padding:13px 16px;font-size:15.5px;}
#sheetfoot button.primary{padding:13px 16px;font-size:15.5px;}
#sheet h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px;}
.sheet-item{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;
  padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
.sheet-item .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.sheet-item input{padding:8px 10px;font-size:15px;}
.srcbadge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.srcbadge.lib{background:color-mix(in srgb,var(--green) 12%,#fff);color:var(--green);}
.srcbadge.ai{background:color-mix(in srgb,var(--blue) 12%,#fff);color:var(--blue);}
#toast{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:999px;
  z-index:70;display:none;align-items:center;gap:12px;white-space:nowrap;box-shadow:0 8px 26px rgba(0,0,0,.28);}
#toast button{background:none;border:none;color:inherit;font-weight:800;padding:0;text-decoration:underline;}
#chip{position:fixed;display:none;transform:translate(-50%,-135%);background:var(--ink);color:#fff;
  font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;z-index:65;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.24);pointer-events:none;font-variant-numeric:tabular-nums;}
.chart{width:100%;height:auto;display:block;}
.chart text{font-family:var(--sans);fill:var(--muted);font-size:9px;}
.banner{background:var(--amber-tint);border:none;
  border-radius:16px;padding:13px 15px;font-size:13.5px;margin-bottom:12px;line-height:1.5;}
.foodrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(20,26,34,.05);}
.foodrow:last-child{border-bottom:none;}
.foodrow .star{font-size:18px;color:var(--tonal2);background:none;border:none;padding:4px;}
.foodrow .star.fav{color:#F0A312;}
.wkrow{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid rgba(20,26,34,.05);font-size:14px;}
.wkrow:last-child{border-bottom:none;}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.kpi{background:var(--surface);border-radius:16px;border:0.5px solid var(--border);padding:13px 15px;box-shadow:var(--shadow);}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.kpi .l{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em;}
/* ── Activity (v3.0): green = living run only; brick = fallen; wall unlabeled ── */
.actrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid rgba(20,26,34,.05);cursor:pointer;}
.actrow:last-child{border-bottom:none;}
.actrow .info{flex:1;min-width:0;}
.actrow .info .n{font-size:15px;font-weight:600;}
.pips{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;}
.pip{width:8px;height:8px;border-radius:50%;background:var(--tonal2);}
.pip.f{background:var(--accent);}
/* check disc: faded promise → kept promise. Both states accent-colored;
   fill deepens on completion, geometry never moves. */
button.actdone{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:39px;height:39px;padding:0;
  background:color-mix(in srgb,var(--accent) 10%,#fff);border:1.75px solid var(--accent);color:var(--accent);}
/* resting = dock-icon pen (V3); filled = the approved solid check (V1) */
.actdone svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
.actdone.did{background:var(--accent);color:#fff;opacity:1;}
.actdone.did svg{stroke-width:3.25;}
/* the wall: usage-grid style — one flat square per day, months as blocks
   (the 1st starts a new row), intensity = activities logged that day,
   color = allegiance (green living run / brick fallen). Unlabeled. */
.swall{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-bottom:3px;}
.swall:last-child{margin-bottom:0;}
.swall .d{aspect-ratio:1;border-radius:2px;background:var(--surface2);}
.swall .d.g1{background:color-mix(in srgb,var(--green) 45%,#fff);}
.swall .d.g2{background:color-mix(in srgb,var(--green) 72%,#fff);}
.swall .d.g3{background:var(--green);}
.swall .d.b1{background:color-mix(in srgb,var(--brick) 40%,#fff);}
.swall .d.b2{background:color-mix(in srgb,var(--brick) 68%,#fff);}
.swall .d.b3{background:var(--brick);}
@keyframes markpop{0%{transform:scale(0);}60%{transform:scale(1.3);}100%{transform:scale(1);}}
.swall .d.new,.pip.new{animation:markpop .45s var(--spring);}
</style>
</head>
<body data-view="today">
<div id="wrap">
  <header><h1 id="title">Balance</h1><span id="syncdot">local</span></header>
  <main id="main"></main>
</div>

<nav>
  <button id="tab-today" onclick="go('today')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Today</button>
  <button id="tab-activity" onclick="go('activity')"><svg viewBox="0 0 24 24"><path d="M13 3 5 13.5h5L11 21l8-10.5h-5L13 3z"/></svg>Activity</button>
  <button id="tab-trends" onclick="go('trends')"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Trends</button>
  <button id="tab-foods" onclick="go('foods')"><svg viewBox="0 0 24 24"><path d="M5 3v18M5 10c3 0 4-2 4-7M12 3v18M12 3c4 1 4 8 0 9"/><path d="M18 3c2 2 3 5 3 8s-1 4-3 4v6"/></svg>Foods</button>
  <button id="tab-settings" onclick="go('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</button>
</nav>

<div id="overlay" onclick="if(event.target===this && !_modalSheet)closeSheet()"><div id="sheet"><div id="sheetbody"></div><div id="sheetfoot"></div></div></div>
<div id="toast"></div>
<div id="chip"></div>

<script>
"use strict";
const APP_VERSION = "3.0.1";
/* ───────────────────────── state ───────────────────────── */
const DEMO = location.search.includes("demo=1");
const LSKEY = DEMO ? "balance:demo" : "balance:v1";
const SECKEY = "balance:secrets";

let S = norm(load()) || seed();
let SEC = JSON.parse(localStorage.getItem(SECKEY) || "{}");
if(!SEC.repo) SEC.repo = "DanielPlochinger/balance-data";
if(!SEC.model) SEC.model = "claude-opus-5";
let remoteSha = null, syncTimer = null, view = "today", pendingItems = null;

function load(){ try{ return JSON.parse(localStorage.getItem(LSKEY)); }catch(e){ return null; } }
// v3.0: states written before the Activity tab lack its two keys.
function norm(st){ if(st){ st.activities = st.activities || []; st.activityLogs = st.activityLogs || []; } return st; }
function seed(){
  const s = { v:1,
    config:{ budget:2000, maintenance:2400, cap:300, goal:null, u:Date.now() },
    days:{}, foods:[], activities:[], activityLogs:[] };
  if(DEMO) demoSeed(s);
  return s;
}
function cache(){ localStorage.setItem(LSKEY, JSON.stringify(S)); _L = null; }
function saveSec(){ localStorage.setItem(SECKEY, JSON.stringify(SEC)); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function dkey(d){ const x = d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function dayRec(k){ if(!S.days[k]) S.days[k] = { e:[], u:0 }; return S.days[k]; }

/* ─────────────── math: §0 daily settlement (see V2.4_PLAN.md) ─────────────── */
const cfg = () => S.config;
const consumed = r => (r.e||[]).reduce((a,x)=>a+x.k,0);
const tracked = r => r && r.e && r.e.length > 0;
// §13 snapshots: closed days are judged by the settings they were lived under.
const dayBudget = r => (r && r.b) || cfg().budget;
const dayCap = r => (r && r.c) || cfg().cap;
const dayMaint = r => (r && r.m) || cfg().maintenance || 2400;
function addDaysK(k, n){ const d = new Date(k+"T12:00"); d.setDate(d.getDate()+n); return dkey(d); }

// §3 repayment formula — constants 60% / 400 / 900 / 500, integer-exact.
function schedule(D){
  D = Math.round(D); if(D <= 0) return [];
  const d1 = Math.min(D, Math.min(900, Math.max(400, Math.round(D*0.6))));
  const R = D - d1; if(R <= 0) return [d1];
  const n = Math.ceil(R/500), base = Math.floor(R/n);
  const tail = Array(n).fill(base); tail[n-1] = R - base*(n-1);
  return [d1, ...tail];
}

function closedDays(){ return Object.keys(S.days).filter(k => k < dkey() && tracked(S.days[k])).sort(); }

// Single chronological replay; memoized per render (_L reset in render()).
let _L = null;
function ledger(){
  if(_L) return _L;
  const today = dkey(), keys = closedDays();
  const deps = [], missDays = {}, trims = {}, settle = {};
  let debt = 0, plan = [];
  if(keys.length){
    let k = keys[0];
    while(k < today){
      for(const d of deps) if(!d.dead && d.expires <= k){ d.left = 0; d.dead = true; }
      const r = S.days[k];
      const trim = plan.length ? plan[0] : 0;
      if(trim) trims[k] = trim;
      if(!tracked(r)){
        // §3: unlogged mid-plan = miss; fresh schedule from the next day.
        if(plan.length) plan = schedule(debt);
        k = addDaysK(k, 1); continue;
      }
      if(plan.length) plan.shift();
      const B = dayBudget(r), C = dayCap(r);
      const sav = Math.round(B - consumed(r));
      if(sav >= 0){
        let pay = Math.min(sav, trim) + Math.min(Math.max(sav - trim, 0), C);
        pay = Math.min(pay, debt);
        debt -= pay;
        settle[k] = { dep: 0, repaid: pay, draw: 0, debtAdd: 0 };
        if(debt === 0){
          const allowanceLeft = Math.max(C - Math.max(pay - trim, 0), 0);
          const dep = Math.min(Math.max(sav - pay, 0), allowanceLeft);
          if(dep > 0){ deps.push({ k, amt: dep, left: dep, expires: addDaysK(k, 10) }); settle[k].dep = dep; }
          plan = [];
        } else if(sav < trim){
          missDays[k] = true;                    // partial repayment counted, but a miss
          plan = schedule(debt);
        } else {
          // trim resolved; good news shortens the schedule from the back
          let sum = plan.reduce((a,x)=>a+x, 0);
          while(sum > debt && plan.length){
            const cut = Math.min(plan[plan.length-1], sum - debt);
            plan[plan.length-1] -= cut; sum -= cut;
            if(plan[plan.length-1] === 0) plan.pop();
          }
          if(debt > 0 && !plan.length) plan = schedule(debt);
        }
      } else {
        let need = -sav, used = 0;
        for(const d of deps){ if(need <= 0) break; if(d.left <= 0) continue;
          const take = Math.min(d.left, need); d.left -= take; need -= take; used += take; }
        settle[k] = { dep: 0, repaid: 0, draw: used, debtAdd: Math.max(need, 0) };
        if(trim) missDays[k] = true;             // trim entirely unresolved
        if(need > 0){ debt += need; plan = schedule(debt); }
        else if(trim) plan = schedule(debt);
      }
      k = addDaysK(k, 1);
    }
    for(const d of deps) if(!d.dead && d.expires <= today){ d.left = 0; d.dead = true; }
  }
  _L = { deposits: deps.filter(d => !d.dead), debt: Math.round(debt),
         bank: Math.round(deps.reduce((a,d)=>a+d.left,0)), missDays, trims, settle,
         todayTrim: plan.length ? plan[0] : 0, plan: plan.slice() };
  return _L;
}
function bank(){ const L = ledger(); return L.debt > 0 ? -L.debt : L.bank; }
function bankDisplay(){ const b = bank();
  return { v: (b>=0?"+":"")+b.toLocaleString(), col: b<0 ? "var(--over)" : "var(--green)" }; }
function targetToday(){ return cfg().budget - ledger().todayTrim; }
function streak(){
  const L = ledger(); let n = 0; const d = new Date(); d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){
    const k = dkey(d);
    if(tracked(S.days[k]) && !L.missDays[k]) { n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return n;
}
function weekStart(k){ const d = new Date(k+"T12:00"); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return dkey(d); }
// §16: weekly closes are physiological — vs snapshotted maintenance, never budget/trims.
function weeklyCloses(){
  const wk = {};
  for(const k of closedDays()){
    const r = S.days[k];
    const w = weekStart(k);
    wk[w] = wk[w] || { net:0, days:0 };
    wk[w].net += dayMaint(r) - consumed(r);
    wk[w].days++;
  }
  return Object.entries(wk).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
}
function ema(pairs, a=0.3){
  let m = null; const out = [];
  for(const [k,w] of pairs){ m = m===null ? w : a*w + (1-a)*m; out.push([k,m]); }
  return out;
}
function weights(n){
  const out = []; const d = new Date(); d.setDate(d.getDate()-n+1);
  for(let i=0;i<n;i++){ const k = dkey(d); const r = S.days[k];
    if(r && r.w) out.push([k, r.w]); d.setDate(d.getDate()+1); }
  return out;
}

/* ───────────────────────── LLM parse ───────────────────────── */
async function llmParse(text){
  if(DEMO) return demoParse(text);
  if(!SEC.anthropic) throw new Error("No Claude API key yet — add it in Settings.");
  const lib = S.foods.slice(0,300).map(f=>`${f.i}|${f.n}|per ${f.per==="item"?"item":f.per==="100ml"?"100 ml":"100 g"}|${f.k} kcal`).join("\n");
  const sys = `You convert casual food-diary text (often dictated, possibly German or English) into structured nutrition data.
Rules:
- Split the text into individual food items with quantities.
- The user's saved foods are listed below with an id. If an item clearly matches one, set library_id to that id — the app recomputes kcal from the library, so your numbers are only a fallback.
- Otherwise estimate kcal yourself using standard nutrition knowledge. kcal must be the TOTAL for the stated quantity.
- grams: your best estimate of the total weight in grams for the line (0 if it makes no sense). For drinks and liquids — especially library foods with a per-100 ml basis — report the volume in millilitres as grams (assume 1 ml ≈ 1 g).
- Exercise and activities (workouts, runs, classes, sports) are NEGATIVE kcal. Use the user's stated number as negative ("spin class -500" or "spin class 500 burned" → kcal -500); estimate only if no number is given. grams: 0.
- unit: short label like "item", "g", "ml", "slice", "cup".
- Keep names short and singular ("Cappuccino", not "two cappuccinos").
User's saved foods (id|name|basis|kcal):
${lib || "(none yet)"}`;
  const schema = { type:"object", additionalProperties:false, required:["items"], properties:{
    items:{ type:"array", items:{ type:"object", additionalProperties:false,
      required:["name","qty","unit","grams","kcal","library_id"],
      properties:{ name:{type:"string"}, qty:{type:"number"}, unit:{type:"string"},
        grams:{type:"number"}, kcal:{type:"number"},
        library_id:{type:"string"} } } } } };
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":SEC.anthropic,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model:SEC.model, max_tokens:2500,
      output_config:{ effort:"low", format:{ type:"json_schema", schema } },
      system:sys, messages:[{ role:"user", content:text }] })
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error("Claude API " + res.status + ": " + (err.error && err.error.message || "request failed"));
  }
  const msg = await res.json();
  if(msg.stop_reason === "refusal") throw new Error("Claude declined this request — try rephrasing.");
  const block = (msg.content||[]).find(b=>b.type==="text");
  if(!block) throw new Error("Empty response from Claude.");
  return JSON.parse(block.text).items || [];
}

function findFood(id){ return S.foods.find(f=>f.i===id); }
function enrich(items){
  return items.map(it=>{
    const f = it.library_id ? findFood(it.library_id) : null;
    let k = Math.round(it.kcal), src = "ai";
    if(f){
      src = "lib";
      if(f.per === "item"){ k = Math.round(f.k * it.qty); }
      else { const g = it.grams > 0 ? it.grams : (f.g||100) * it.qty;
             k = Math.round(f.k * g/100); }
    }
    return { name:it.name, qty:it.qty, unit:it.unit, grams:it.grams, k, src, save:false };
  });
}

/* ─────────── sync: remote truth (V2.5_PLAN.md §1/§7) ─────────── */
function ghReady(){ return !DEMO && SEC.github && SEC.repo; }
const ghUrl = (path = "state.json") => `https://api.github.com/repos/${SEC.repo}/contents/${path}`;
function ghHeaders(){ return { "Authorization":"Bearer "+SEC.github, "Accept":"application/vnd.github+json" }; }
function setDot(cls, txt){ const d = document.getElementById("syncdot"); d.className = cls; d.textContent = txt; }
async function ghErr(res){
  const j = await res.json().catch(()=>({}));
  return "HTTP "+res.status+(j.message?" — "+j.message:"");
}
const b64enc = str => { const b = new TextEncoder().encode(str); let out = ""; b.forEach(c => out += String.fromCharCode(c)); return btoa(out); };
const b64dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,"")), c => c.charCodeAt(0)));

let NET = "boot";          // boot | on | off | err
let lastSyncErr = null;
const isOffline = () => !DEMO && NET !== "on";

// §3: settings-of-the-day, written onto the open day at every write.
function stampToday(st){
  const r = st.days[dkey()];
  if(!r) return;
  const c = st.config;
  r.b = c.budget; r.c = c.cap; r.g = c.goal ?? null; r.m = c.maintenance || 2400;
}

async function ghGetState(){
  const res = await fetch(ghUrl() + "?ref=main&t=" + Date.now(), { headers: ghHeaders() });
  if(res.status === 404) return { state: null, sha: undefined };
  if(!res.ok) throw new Error(await ghErr(res));
  const j = await res.json();
  return { state: JSON.parse(b64dec(j.content)), sha: j.sha };
}

async function fetchState(){
  if(DEMO){ setDot("", "demo"); return; }
  if(!ghReady()){ NET = "off"; setDot("", "offline"); return; }
  setDot("pending", NET === "boot" ? "connecting" : "syncing");
  try{
    const { state } = await ghGetState();
    if(state){ S = norm(state); cache(); }
    NET = "on"; lastSyncErr = null; setDot("ok", "live"); render();
  }catch(e){
    lastSyncErr = e.message;
    NET = (e instanceof TypeError) ? "off" : "err";
    setDot(NET === "off" ? "" : "err", NET === "off" ? "offline" : "error");
    render();
  }
}

// One user action = one remote write. In-flight writes serialize (not an
// offline queue: nothing persists; offline blocks writes before they start).
let _wq = Promise.resolve();
// v3.0.1 optimistic UI: pre-write snapshot for rollback; set on the first
// in-flight optimistic write, cleared on success or restored on failure.
let _optPrev = null;
function write(mutate, label){
  if(DEMO){ mutate(S); stampToday(S); cache(); render(); return Promise.resolve(true); }
  if(!ghReady()){ toast("Add your GitHub token in Settings first"); return Promise.resolve(false); }
  if(isOffline() && NET !== "boot"){ toast("Offline — logging needs a connection"); return Promise.resolve(false); }
  // v3.0.1: gates passed — flip the UI now, reconcile truth behind it.
  // Pure cosmetics on an in-flight request: no queue, no merge; the
  // authoritative result below replaces this guess either way.
  if(!_optPrev) _optPrev = structuredClone(S);
  try{ mutate(S); stampToday(S); }catch(e){}
  cache(); render();
  const job = async () => {
    setDot("pending", "saving");
    try{
      for(let attempt = 0; attempt < 3; attempt++){
        const { state, sha } = await ghGetState();
        const st = norm(state || seed());
        mutate(st);
        stampToday(st);
        const body = { message: label || "balance", content: b64enc(JSON.stringify(st)) };
        if(sha) body.sha = sha;
        const put = await fetch(ghUrl(), { method:"PUT", headers: ghHeaders(), body: JSON.stringify(body) });
        if(put.status === 409 || put.status === 422) continue;     // conflict: refetch + reapply
        if(!put.ok) throw new Error(await ghErr(put));
        S = st; _optPrev = null; cache(); NET = "on"; lastSyncErr = null;
        setDot("ok", "live"); render();
        return true;
      }
      if(_optPrev){ S = _optPrev; _optPrev = null; cache(); }        // roll back the guess
      lastSyncErr = "conflict retries exhausted";
      setDot("err", "error"); toast("Sync conflict — try again"); render();
      return false;
    }catch(e){
      if(_optPrev){ S = _optPrev; _optPrev = null; cache(); }        // roll back the guess
      lastSyncErr = e.message;
      NET = (e instanceof TypeError) ? "off" : "err";
      setDot(NET === "off" ? "" : "err", NET === "off" ? "offline" : "error");
      toast(NET === "off" ? "Offline — logging needs a connection" : "Save failed — see Settings › Test connections");
      render();
      return false;
    }
  };
  const p = _wq.then(job, job);
  _wq = p.catch(()=>{});
  return p;
}

/* §1 (v2.5.1) historic day sheet: tap a calorie bar, get the day. */
function daySheet(k){
  const L = ledger(), today = dkey();
  const r = S.days[k];
  const tracked_ = tracked(r);
  // 2.5.1.1 bounds: earliest logged day ←→ today
  const loggedKeys = Object.keys(S.days).filter(x => tracked(S.days[x])).sort();
  const minK = loggedKeys[0] || today;
  const canPrev = k > minK, canNext = k < today;
  const date = new Date(k+"T12:00").toLocaleDateString("en-GB",{ weekday:"long", day:"numeric", month:"long" });
  const arrowStyle = "font-size:22px;padding:2px 12px;line-height:1;color:var(--muted);display:flex;align-items:center;transform:translateY(-1px)";
  const nav = `<div class="row spread" style="align-items:center">
    <button class="ghost" style="${arrowStyle}" ${canPrev?`onclick="daySheet('${addDaysK(k,-1)}')"`:"disabled"}>‹</button>
    <h2 style="margin-bottom:0">${date}</h2>
    <button class="ghost" style="${arrowStyle}" ${canNext?`onclick="daySheet('${addDaysK(k,1)}')"`:"disabled"}>›</button>

  if(!tracked_){
    sheet(`${nav}<div class="sub" style="margin-top:12px">Nothing logged this day.</div>`,
      { tall:true, footer:`<button style="flex:1" onclick="closeSheet()">Close</button>` });
    return;

  const c = consumed(r);
  const T = k === today ? cfg().budget - L.todayTrim : dayBudget(r) - (L.trims[k]||0);
  const st = L.settle[k];
  let badge = "";

    else if(st.repaid > 0) badge = `<span class="srcbadge lib">${st.repaid.toLocaleString()} repaid</span>`;
    else if(st.draw > 0) badge = `<span class="srcbadge ai">bank covered ${st.draw.toLocaleString()}</span>`;
  }
  sheet(`${nav}
    <div class="row spread" style="margin:10px 0">
      <span class="sub num">eaten ${Math.round(c).toLocaleString()} of ${Math.round(T).toLocaleString()}</span>${badge}</div>

function quickLog(id){ const f = findFood(id); if(!f) return;

function addEntries(items){
  const k = dkey();
  const entries = items.map(it => ({ i:uid(), t:new Date().toTimeString().slice(0,5), n:it.name, q:it.qty||1, k:Math.round(it.k) }));

function saveFoodTo(st, it){
  if(st.foods.some(f=>f.n.toLowerCase()===it.name.toLowerCase())) return;
  const perItem = !(it.grams>0) || it.unit==="item" || (it.qty>=1 && it.unit!=="g" && it.unit!=="ml");

/* ───────────────────────── Trends ───────────────────────── */
function chartWeight(n){
  // v3.0.1: fixed last-n-days date axis with chartCals' exact x-metrics so
  // the two charts align date-for-date. EMA and the goal walk cover the
  // FULL 90-day history (one truth — the same line the trend KPI reads);
  // only the rendering is clipped to the window.
  const all = weights(90);
  const d0 = new Date(); d0.setDate(d0.getDate()-n+1);
  const startK = dkey(d0);
  const pts = all.filter(([k]) => k >= startK);
  if(pts.length < 2) return `<div class="sub">Log your weight a few mornings and the trend appears here.</div>`;
  const sm = ema(all).filter(([k]) => k >= startK);
  const W = 340, H = 150, P = 6, band = (W-2*P)/n;
  const X = k => P + (daysBetween(startK, k) + 0.5) * band;
  const Y = v => H-16 - (v-lo)*(H-28)/(hi-lo);
  // §13: stepped goal from per-day snapshots, walked over the full history
  // so the value entering the window is the historic snapshot.
  let lastG = cfg().goal ?? null;
  const goalByK = {};
  for(const [k] of all){ const r = S.days[k]; if(r && r.g !== undefined && r.g !== null) lastG = r.g; goalByK[k] = lastG; }
  const winGoals = pts.map(([k]) => goalByK[k]);
  const liveGoals = winGoals.filter(g => g);
  const ys = pts.map(p=>p[1]).concat(sm.map(p=>p[1])).concat(liveGoals);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = Math.max((hi-lo)*0.15, 0.4); lo-=pad; hi+=pad;
  const line = sm.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const lastK = pts[pts.length-1][0], cur = pts[pts.length-1][1];
  // ruler lives BEHIND the data: full-width faint lines, labels at the left
  // edge, no reserved gutter (Daniel, 2026-08-23 — exact alignment wins)
  const range = hi - lo;
  const step = [0.5, 1, 2, 5, 10].find(s => range / s <= 6) || 10;
  let ruler = "";
  for(let v = Math.ceil(lo/step)*step; v <= hi; v += step){
    ruler += `<line x1="${P}" x2="${W-P}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--border)" stroke-width="0.5"/>
      <text x="${P+2}" y="${(Y(v)-2.5).toFixed(1)}" font-size="8" fill="var(--tonal2)">${step<1?v.toFixed(1):Math.round(v)}</text>`;
  }
  let goal = "", goalHidden = false;
  if(liveGoals.length){
    let path = "", prev = null;
    pts.forEach(([k],i)=>{ const g = winGoals[i]; if(!g) return;
      if(prev === null) path += `M${X(k).toFixed(1)} ${Y(g).toFixed(1)}`;
      else path += `L${X(k).toFixed(1)} ${Y(prev).toFixed(1)}` + (g!==prev?` L${X(k).toFixed(1)} ${Y(g).toFixed(1)}`:"");
      prev = g; });
    path += `L${(W-P).toFixed(1)} ${Y(prev).toFixed(1)}`;
    goalHidden = Math.abs(Y(prev) - Y(cur)) < 16; // collision: weight wins
    goal = `<path d="${path}" fill="none" stroke="var(--gold)" stroke-dasharray="4 4" stroke-width="1"/>` +
      (goalHidden ? "" : `<text x="${W-10}" y="${(Y(prev)-4).toFixed(1)}" text-anchor="end" fill="var(--gold)">goal ${prev}</text>`);
  }
  const chipFor = (k,w) => `showChip(event,'${new Date(k+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})} · ${w}')`;
  // current-weight numeral rides its dot, not the chart edge
  const curX = Math.min(Math.max(X(lastK), P+18), W-18);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${ruler}
    <line x1="${P}" x2="${W-P}" y1="${H-16}" y2="${H-16}" stroke="var(--border)" />
    ${goal}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.8" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.2" opacity="0.8"/>
      <circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="11" fill="transparent" onclick="${chipFor(p[0], p[1])}"/>`).join("")}
    <text x="${curX.toFixed(1)}" y="${(Y(cur)-9).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="700" class="num">${cur}</text>
  </svg>`;
}
function chartCals(n){
  const L = ledger(), today = dkey();
  const days = []; const d = new Date(); d.setDate(d.getDate()-n+1);
  for(let i=0;i<n;i++){ const k = dkey(d); days.push([k, S.days[k]]); d.setDate(d.getDate()+1); }
  const W = 340, H = 130, P = 6, bw = (W-2*P)/n - 3;
  // §13: per-day snapshotted budgets, carried forward across untracked gaps.
  let lastB = cfg().budget;
  const budgets = days.map(([k,r])=>{ if(k === today) return cfg().budget; if(r && r.b) lastB = r.b; return lastB; });
  const maxV = Math.max(...budgets.map(b=>b*1.3), ...days.map(([k,r])=>r?consumed(r):0));
  const Y = v => H-18 - v*(H-34)/maxV;
  const X = i => P + i*((W-2*P)/n);
  let bars = "";
  days.forEach(([k,r],i)=>{
    if(!tracked(r)) return;
    const c = consumed(r);
    const t = (k === today ? cfg().budget - L.todayTrim : budgets[i] - (L.trims[k]||0));
    const col = c > t ? "var(--over)" : "var(--accent)";
    const cSafe = Math.max(c, 0);
    const h = Math.max(H-18-Y(cSafe), 2);
    bars += `<rect x="${X(i).toFixed(1)}" y="${(H-18-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="${col}" onclick="event.stopPropagation();daySheet('${k}')"/>`;
  });
  // stepped budget line
  let bpath = `M${P} ${Y(budgets[0]).toFixed(1)}`;
  for(let i=1;i<n;i++){ bpath += `L${X(i).toFixed(1)} ${Y(budgets[i-1]).toFixed(1)}` + (budgets[i]!==budgets[i-1]?` L${X(i).toFixed(1)} ${Y(budgets[i]).toFixed(1)}`:""); }
  bpath += `L${W-P} ${Y(budgets[n-1]).toFixed(1)}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <path d="${bpath}" fill="none" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>
    <text x="${W-P}" y="${Y(budgets[n-1])-4}" text-anchor="end">budget ${budgets[n-1]}</text>
    ${bars}<line x1="${P}" x2="${W-P}" y1="${H-18}" y2="${H-18}" stroke="var(--border)"/>
    <text x="${P}" y="${H-4}">${days[0][0].slice(5)}</text><text x="${W-P}" y="${H-4}" text-anchor="end">today</text>
  </svg>`;
}
function renderTrends(){
  const wc = weeklyCloses();
  const w = weights(45); const first = w[0], last = w[w.length-1];
  const delta = first && last && w.length>1 ? (ema(w)[w.length-1][1] - w[0][1]) : null;
  const bd = bankDisplay();
  let h = `<div class="kpis">
    <div class="kpi"><div class="l">45-day trend</div><div class="v" style="color:${delta<0?"var(--ok)":"var(--ink)"}">${delta===null?"–":(delta>0?"+":"")+delta.toFixed(1)+" kg"}</div></div>
    <div class="kpi" onclick="bankSheet()" style="cursor:pointer"><div class="l">Calorie bank</div><div class="v" style="color:${bd.col}">${bd.v}</div></div>
  </div>`;
  h += `<div class="card"><h3>Weight — dots are mornings, line is the truth</h3>${chartWeight(14)}</div>`;
  h += `<div class="card"><h3>Last 14 days vs target</h3>${chartCals(14)}</div>`;
  h += `<div class="card"><h3>Weekly closes — vs maintenance</h3>`;
  h += wc.length ? wc.map(([wk,x])=>{
    const sign = x.net>=0 ? "−" : "+";
    return `<div class="wkrow"><span>Week of ${wk.slice(5)}</span>
      <span class="num" style="color:${x.net>=0?"var(--ok)":"var(--over)"}">${sign}${Math.abs(Math.round(x.net)).toLocaleString()} kcal ≈ ${sign}${Math.abs(x.net/7700).toFixed(2)} kg</span></div>`;
  }).join("") : `<div class="sub">Your first weekly close lands after a few tracked days.</div>`;
  h += `</div>`;
  return h;
}

/* ─────────────── Activity (v3.0 — see V3.0_PLAN.md) ───────────────
   Facts, not math: logs and definition history are immutable inputs;
   every verdict below is re-derived from them and never persisted.
   Zero coupling to the ledger — removable without a trace. */
function daysBetween(a, b){ return Math.round((new Date(b+"T12:00") - new Date(a+"T12:00"))/86400000); }
let _A = null;
function actLedger(){
  if(_A) return _A;
  const acts = S.activities || [], logs = S.activityLogs || [];
  const today = dkey(), curMon = weekStart(today);
  const byAct = {}, byDate = {};
  for(const a of acts) byAct[a.id] = new Set();
  for(const l of logs){
    if(byAct[l.activityId]) byAct[l.activityId].add(l.date);
    (byDate[l.date] = byDate[l.date] || []).push(l.activityId);
  }
  // §2: a week's quota = the last targets entry effective by its Monday
  // (created mid-week: the first entry applies — creation week can't break).
  const targetFor = (a, mon) => {
    let t = a.targets[0].perWeek;
    for(const x of a.targets) if(x.from <= mon) t = x.perWeek;
    return t;
  };
  const doneInWeek = (a, mon) => { let n = 0; for(let i=0;i<7;i++) if(byAct[a.id].has(addDaysK(mon,i))) n++; return n; };
  // §2 failure: the first CLOSED day of a week on which the quota became
  // impossible. Never in the creation week, never from retiredFrom on.
  let lastFail = null;
  for(const a of acts){
    let mon = addDaysK(weekStart(a.created), 7);
    while(mon <= curMon && !(a.retiredFrom && mon >= a.retiredFrom)){
      const t = targetFor(a, mon);
      let done = 0;
      for(let i=0;i<7;i++){
        const d = addDaysK(mon, i);
        if(d >= today) break;                       // open/future days are never judged
        if(byAct[a.id].has(d)) done++;
        if(t - done > 6 - i){ if(!lastFail || d > lastFail) lastFail = d; break; }
      }
      mon = addDaysK(mon, 7);
    }
  }
  const createds = acts.map(a => a.created).sort();
  const streakStart = lastFail ? addDaysK(lastFail, 1) : (createds[0] || null);
  const active = acts.filter(a => !a.retiredFrom || a.retiredFrom > today);
  // §2: completed days only — streakStart..yesterday inclusive; dash on zero commitments.
  const streak = active.length && streakStart ? Math.max(0, daysBetween(streakStart, today)) : null;
  _A = { acts, active, byAct, byDate, targetFor, doneInWeek, streakStart, streak, curMon, today };
  return _A;
}
function findAct(id){ return (S.activities || []).find(a => a.id === id); }

function renderActivity(){
  const A = actLedger(), today = A.today, curMon = A.curMon;
  let h = "";
  // rows: everything still carrying this week's expectations (incl. retiring after it)
  const rows = A.acts.filter(a => !a.retiredFrom || curMon < a.retiredFrom);
  const dayIdx = daysBetween(curMon, today);
  const slack = a => {
    const need = A.targetFor(a, curMon) - A.doneInWeek(a, curMon);
    return need <= 0 ? 99 : (7 - dayIdx) - need;    // closest-to-impossible first
  };
  rows.sort((a, b) => slack(a) - slack(b) || a.name.localeCompare(b.name));
  h += `<div class="card">`;
  h += rows.length ? rows.map(a => {
    const t = A.targetFor(a, curMon), done = A.doneInWeek(a, curMon);
    const didToday = A.byAct[a.id].has(today);
    const isNew = window._justLogged && window._justLogged.id === a.id;
    const pips = Array.from({length: t}, (_, i) =>
      `<span class="pip${i < done ? " f" : ""}${isNew && i === done - 1 ? " new" : ""}"></span>`).join("");
    return `<div class="actrow" onclick="actSheet('${a.id}')">
      <span class="info"><span class="n">${esc(a.name)}</span>${a.desc ? `<div class="sub">${esc(a.desc)}</div>` : ""}
        <div class="pips">${pips}</div></span>
      <button class="actdone${didToday ? " did" : ""}" ${didToday ? "disabled" : ""} onclick="event.stopPropagation();actLog('${a.id}')"><svg viewBox="0 0 24 24"><path d="M5.5 12.5l4.7 4.7L18.5 7.5"/></svg></button>
    </div>`;
  }).join("") : `<div class="sub">Commit to something — push-ups every morning, spin class twice a week. Each activity sets how many times per week it happens; the moment a week's quota becomes impossible, the whole streak breaks. Unforgiving on purpose.</div>`;
  h += `</div>`;
  h += `<div class="row" style="justify-content:center;margin-bottom:14px"><button class="ghost" onclick="newActSheet()">+ New activity</button></div>`;
  h += renderWall(A);
  window._justLogged = null;
  return h;
}
// The wall: unlabeled usage-style grid, newest month on top, endless
// downward. One square per day; the 1st of a month starts a new block.
// Existence is fact (a colored square proves deeds); color is allegiance
// (green only while part of the living run); depth = deeds that day.
// Purely visual — no math reads it.
function renderWall(A){
  const logs = S.activityLogs || [];
  if(!logs.length && !A.acts.length) return "";
  const counts = {};
  for(const l of logs) counts[l.date] = (counts[l.date] || 0) + 1;
  const today = A.today;
  const firstMk = (Object.keys(counts).sort()[0] || today).slice(0, 7);
  const pill = A.streak !== null ? `<span class="streak"${A.streak === 0 ? ' style="background:var(--surface2);color:var(--muted)"' : ""}>⚡ ${A.streak === 0 ? "0 days — today restarts it" : A.streak + " day" + (A.streak === 1 ? "" : "s")}</span>` : "";
  let h = `<div class="card"><div class="row spread" style="margin-bottom:11px"><h3 style="margin-bottom:0">Streaks</h3>${pill}</div>`;
  let mk = today.slice(0, 7);
  while(mk >= firstMk){
    const [Y, M] = mk.split("-").map(Number);
    const dim = new Date(Y, M, 0).getDate();
    // sediment: day 1 starts the bottom row, each 14-day chunk stacks above.
    // Grey squares exist only for REAL dates — the current row fills out with
    // the month's actual upcoming days; a finished month's top row just ends.
    const isCur = mk === today.slice(0, 7);
    const lastRow = isCur ? Math.floor((Number(today.slice(8)) - 1) / 14) : Infinity;
    const cells = [];
    for(let day = 1; day <= dim; day++){
      if(Math.floor((day - 1) / 14) > lastRow) break;
      const k = mk + "-" + String(day).padStart(2, "0");
      const n = k > today ? 0 : Math.min(counts[k] || 0, 3);
      const cls = n === 0 ? "" : (A.streakStart && k >= A.streakStart ? " g" : " b") + n;
      cells.push(`<span class="d${cls}${window._justLogged && window._justLogged.date === k ? " new" : ""}"></span>`);
    }
    const rows = [];
    for(let i = 0; i < cells.length; i += 14) rows.unshift(cells.slice(i, i + 14));
    for(const r of rows) h += `<div class="swall">${r.join("")}</div>`;
    mk = dkey(new Date(Y, M - 2, 15)).slice(0, 7);
  }
  return h + `</div>`;
}

function actLog(id, date){
  date = date || dkey();
  if(!findAct(id)) return;
  window._justLogged = { id, date };
  write(st => {
    if(!st.activityLogs.some(l => l.activityId === id && l.date === date))
      st.activityLogs.push({ date, activityId: id });
  }, "activity log").then(ok => {
    if(ok) toast("Logged", () => write(st => {
      st.activityLogs = st.activityLogs.filter(l => !(l.activityId === id && l.date === date));
    }, "activity log undo"));
  });
}
function actPerWeekInput(){ return Math.min(7, Math.max(1, Math.round(parseFloat($("#ap").value) || 1))); }
function newActSheet(){
  sheet(`<h2>New activity</h2>
    <label>Name</label><input id="an" placeholder="Morning push-ups">
    <label>Description</label><input id="ad" placeholder="20 push-ups before coffee">
    <label>Times per week</label><input id="ap" type="number" inputmode="numeric" min="1" max="7" value="7">
    <div class="sub" style="margin-top:8px">7 = every day. Miss a week's quota once and the whole streak breaks — commit only to what you'll keep.</div>`,
    { modal: true, footer: `<button onclick="closeSheet()">Cancel</button>
      <button class="primary" style="flex:1" onclick="actCreate()">Create</button>` });
}
function actCreate(){
  const name = $("#an").value.trim(); if(!name) return;
  const desc = $("#ad").value.trim(), p = actPerWeekInput(), k = dkey();
  closeSheet();
  write(st => { st.activities.push({ id: uid(), name, desc, targets: [{ from: k, perWeek: p }], created: k }); }, "activity create");
}
function actSheet(id){
  const a = findAct(id); if(!a) return;
  const A = actLedger(), yesterday = addDaysK(A.today, -1);
  // §2 mistake-delete: only with no logs and still inside the creation week
  const canDelete = weekStart(a.created) === A.curMon && A.byAct[a.id].size === 0;
  const canYesterday = yesterday >= a.created && !A.byAct[a.id].has(yesterday);
  sheet(`<h2>Edit activity</h2>
    <label>Name</label><input id="an" value="${esc(a.name)}">
    <label>Description</label><input id="ad" value="${esc(a.desc || "")}">
    <label>Times per week</label><input id="ap" type="number" inputmode="numeric" min="1" max="7" value="${A.targetFor(a, A.curMon)}">
    <div class="sub" style="margin-top:8px">Quota changes take effect on Monday — this week keeps its target.</div>
    <div class="row" style="margin-top:18px">
      <button style="flex:1" ${canYesterday ? `onclick="closeSheet();actLog('${a.id}','${yesterday}')"` : "disabled"}>Log for yesterday</button>
      ${canDelete
        ? `<button class="danger" style="flex:1" onclick="actDeleteConfirm('${a.id}')">Delete</button>`
        : `<button class="danger" style="flex:1" onclick="actRetireConfirm('${a.id}')">Retire</button>`}
    </div>`,
    { modal: true, footer: `<button onclick="closeSheet()">Cancel</button>
      <button class="primary" style="flex:1" onclick="actSave('${a.id}')">Save</button>` });
}
function actSave(id){
  const name = $("#an").value.trim(); if(!name) return;
  const desc = $("#ad").value.trim(), p = actPerWeekInput();
  closeSheet();
  write(st => {
    const a = (st.activities || []).find(x => x.id === id); if(!a) return;
    a.name = name; a.desc = desc;
    // §2 editing: quota changes apply from next Monday; past targets are facts
    const nextMon = addDaysK(weekStart(dkey()), 7);
    let effNext = a.targets[0].perWeek;
    for(const t of a.targets) if(t.from <= nextMon) effNext = t.perWeek;
    const pending = a.targets.find(t => t.from === nextMon);
    if(pending) pending.perWeek = p;
    else if(p !== effNext) a.targets.push({ from: nextMon, perWeek: p });
  }, "activity edit");
}
function actRetireConfirm(id){
  const a = findAct(id); if(!a) return;
  sheet(`<h2>Retire activity?</h2><div class="card"><b>${esc(a.name)}</b>
    <div class="sub" style="margin-top:4px">Expectations end after this week — the current week still counts. Everything on the wall stays, forever.</div></div>`,
    { footer: `<button style="flex:1" onclick="closeSheet()">Cancel</button>
      <button class="danger" style="flex:1" onclick="actRetire('${id}')">Retire</button>` });
}
function actRetire(id){
  closeSheet();
  write(st => { const a = (st.activities || []).find(x => x.id === id); if(a) a.retiredFrom = addDaysK(weekStart(dkey()), 7); }, "activity retire");
}
function actDeleteConfirm(id){
  const a = findAct(id); if(!a) return;
  sheet(`<h2>Delete activity?</h2><div class="card"><b>${esc(a.name)}</b>
    <div class="sub" style="margin-top:4px">No logs yet, so nothing is lost. This removes it completely.</div></div>`,
    { footer: `<button style="flex:1" onclick="closeSheet()">Cancel</button>
      <button class="danger" style="flex:1" onclick="actDelete('${id}')">Delete</button>` });
}
function actDelete(id){
  closeSheet();
  write(st => {
    if((st.activityLogs || []).some(l => l.activityId === id)) return;   // facts are permanent
    st.activities = (st.activities || []).filter(a => a.id !== id);
  }, "activity delete");
}

function demoSeed(s){
  const foods = [
    ["Cappuccino","item",90,1],["Banana","item",105,1],["Egg","item",74,1],
    ["Oats","100g",389,0],["Milk 3.5%","100ml",64,0],["Olive oil","100g",884,0],
    ["Chicken breast","100g",165,1],["Rye bread slice","item",83,0],["Orange juice","100ml",44,0]];
  s.foods = foods.map(([n,per,k,fav])=>({ i:uid(), n, per, k, fav:!!fav, u:Date.now() }));
  s.config.maintenance = 2400;
  // Engineered to exercise every §0 path: expired deposits (i14–i12), a FIFO
  // withdrawal (i11), red near-expiry deposits (i9, i8), a bank-covered feast
  // (i6), and a debt feast (i1) leaving an active [450, 300] plan today.
  // i17/i16: zero-surplus days (no ledger effect); i15 intentionally ABSENT
  // (a real zero-item gap reachable via the day-sheet arrows); i14..i1 keep
  // the engineered totals. Item counts vary 2–15 for realistic day sheets.
  const spec = { 17:2000, 16:2000, 14:1800, 13:1750, 12:1900, 11:2350, 10:1700,
                 9:1650, 8:1750, 7:1900, 6:3000, 5:1800, 4:1850, 3:1900, 2:1750, 1:3600 };
  const counts = { 17:3, 16:5, 14:3, 13:5, 12:8, 11:3, 10:4, 9:5, 8:3, 7:2,
                   6:15, 5:4, 4:3, 3:6, 2:5, 1:8 };
  const names = ["Cappuccino","Eggs","Toast","Yogurt","Apple","Chicken","Rice",
                 "Salad","Cookie","Beer","Cheese","Nuts","Soup","Pasta","Banana",
                 "Chocolate","Wrap","Snack"];
  let w = 87.4;
  for(let i=17;i>=1;i--){
    if(!(i in spec)) continue;
    const d = new Date(); d.setDate(d.getDate()-i); const k = dkey(d);
    const kcal = spec[i], n = counts[i];
    const e = [];
    let rem = kcal;
    for(let j=0;j<n;j++){
      const part = j === n-1 ? rem : Math.max(40, Math.round((kcal/n) * (0.6 + 0.8*Math.abs(Math.sin(i*7+j*3)))));
      const kk = j === n-1 ? rem : Math.min(part, rem - 40*(n-1-j));
      rem -= kk;
      const hh = 8 + Math.floor((13*j)/Math.max(n-1,1));
      e.push({ i:uid(), t:String(hh).padStart(2,"0")+":"+(j%2?"30":"00"), n:names[(i*3+j)%names.length], q:1, k:kk });
    }
    w += (kcal-2400)/7700 + Math.sin(i*2.1)*0.12;
    s.days[k] = { e, w:Math.round(w*10)/10, u:Date.now(), b:2000, c:300, g:80, m:2400 };
  }
  s.days[dkey()] = { e:[ { i:uid(), t:"08:10", n:"Cappuccino", q:2, k:180 },
                         { i:uid(), t:"08:12", n:"Oats with milk", q:1, k:420 },
                         { i:uid(), t:"09:30", n:"Spin class", q:1, k:-500 } ], u:Date.now() };
  // v3.0 Activity: a 6-week wall with one engineered break (push-up miss 16
  // days back) → brick history + fallen washes, then a living green run.
  // Stretching seeds the creation-week state (mistake-deletable, can't break).
  const aCreated = addDaysK(weekStart(dkey()), -42);       // a Monday, 6 weeks back
  const A1 = { id:uid(), name:"Morning push-ups", desc:"20 push-ups before coffee", targets:[{ from:aCreated, perWeek:7 }], created:aCreated };
  const A2 = { id:uid(), name:"Spin class", desc:"45 min at the studio", targets:[{ from:aCreated, perWeek:2 }], created:aCreated };
  const A3 = { id:uid(), name:"Stretching", desc:"10 min wind-down", targets:[{ from:dkey(), perWeek:5 }], created:dkey() };
  s.activities = [A1, A2, A3];
  const missK = addDaysK(dkey(), -16), alogs = [];
  for(let i=42; i>=1; i--){
    const k = addDaysK(dkey(), -i);
    if(k < aCreated) continue;
    if(k !== missK) alogs.push({ date:k, activityId:A1.id });
    const wd = new Date(k+"T12:00").getDay();               // spin: Tue + Thu
    if(wd === 2 || wd === 4) alogs.push({ date:k, activityId:A2.id });
  }
  alogs.push({ date:dkey(), activityId:A1.id });
  s.activityLogs = alogs;
}
